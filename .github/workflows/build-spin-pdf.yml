name: Build spin-correlation PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tex/spin_correlation_*.tex'
      - '.github/workflows/build-spin-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-science poppler-utils

      - name: Assemble staged full report if present
        run: |
          set -euo pipefail
          if [ -d .daily_parts/2026-08-23 ]; then
            cat .daily_parts/2026-08-23/part_*.texpart > tex/spin_correlation_2026-08-23.tex
            test -s tex/spin_correlation_2026-08-23.tex
            echo "Assembled August 23 full report: $(wc -l < tex/spin_correlation_2026-08-23.tex) lines"
          fi

      - name: Compile and verify all spin-correlation reports
        run: |
          set -euo pipefail
          rm -rf build
          mkdir -p pdf build
          for f in tex/spin_correlation_*.tex; do
            [ -e "$f" ] || continue
            base=$(basename "$f" .tex)

            # Never permit a stale binary to survive a source update.
            rm -f "pdf/${base}.pdf" "build/${base}.pdf"

            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode -outdir=build "$f"
            test -s "build/${base}.pdf"

            pages=$(pdfinfo "build/${base}.pdf" | awk '/^Pages:/ {print $2}')
            test -n "$pages"
            test "$pages" -gt 0

            # Historical August 22 repair is validated as a 9-page report.
            if [ "$base" = "spin_correlation_2026-08-22" ]; then
              test "$pages" -eq 9
            else
              # New permanent standard: daily reports from August 23 onward must be substantive >=20 pages.
              test "$pages" -ge 20
            fi

            cp "build/${base}.pdf" "pdf/${base}.pdf"
            test -s "pdf/${base}.pdf"
            echo "Verified ${base}.pdf: ${pages} page(s), $(stat -c%s "pdf/${base}.pdf") bytes"
          done

      - name: Commit canonical TeX and generated PDFs
        run: |
          set -euo pipefail
          if [ -d .daily_parts/2026-08-23 ]; then
            rm -rf .daily_parts/2026-08-23
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A tex/ pdf/ .daily_parts/ || true
          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Rebuild detailed spin-correlation daily reports"
            git push
          fi
