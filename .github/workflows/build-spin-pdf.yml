name: Build spin-correlation PDFs

on:
  push:
    branches: [main]
    paths:
      - 'tex/spin_correlation_*.tex'
      - '.github/workflows/build-spin-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended

      - name: Compile all spin-correlation reports
        run: |
          mkdir -p pdf
          for f in tex/spin_correlation_*.tex; do
            [ -e "$f" ] || continue
            latexmk -pdf -file-line-error -halt-on-error -interaction=nonstopmode -output-directory=pdf "$f"
          done
          rm -f pdf/*.aux pdf/*.fdb_latexmk pdf/*.fls pdf/*.log pdf/*.out pdf/*.toc

      - name: Commit generated PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf/
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build spin-correlation PDF reports"
            git push
          fi
